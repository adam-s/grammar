<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* The social-preview card, in the family style of the blog's og images
         (brand top-left, headline, fact chips, real product UI) but light and
         serif where algoviz is dark and mono.

         The hook is the garden path from the closing lesson: the headline
         reads as broken English, and the app's own diagram beside it proves
         the sentence parses. og-diagram.png is a real capture —
         scripts/og-capture.mjs builds fix-garden-path through the driver hook
         and crops the finished tree. scripts/og.mjs renders this page to
         static/og.png. Colors are light-theme tokens from src/lib/theme.css,
         baked to hex. */
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background-color: #f3f3f3;
        background-image: radial-gradient(circle, #dcdcdc 1.3px, transparent 1.4px);
        background-size: 26px 26px;
        background-position: 13px 13px;
        font-family:
          'Inter var', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #3c3c3c;
      }
      .left {
        position: absolute;
        left: 64px;
        top: 56px;
        bottom: 52px;
        width: 500px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand svg {
        display: block;
      }
      .brand .name {
        font-size: 31px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: #3c3c3c;
      }
      h1 {
        margin: 44px 0 0;
        font-family: 'Source Serif 4', 'Iowan Old Style', Charter, Georgia, serif;
        font-weight: 600;
        font-size: 58px;
        line-height: 1.14;
        letter-spacing: -0.005em;
        color: #2b2b2b;
      }
      .sub {
        margin-top: 22px;
        font-size: 25px;
        line-height: 1.4;
        color: #6f6f70;
      }
      .footer {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tagline {
        font-size: 18px;
        font-weight: 570;
        letter-spacing: 0.002em;
        white-space: nowrap;
        color: #4a4a4b;
      }
      .tagline em {
        font-style: normal;
        color: #0079d1;
      }
      .url {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
        font-size: 18px;
        color: #8f8f90;
      }
      .card {
        position: absolute;
        right: 52px;
        top: 50px;
        width: 560px;
        border: 1px solid #c5c5c5;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.12),
          0 4px 14px rgba(0, 0, 0, 0.06);
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
        /* the capture crops tight under the word row; give it room to breathe */
        padding-bottom: 16px;
        background: #f3f3f3;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="brand">
        <svg width="42" height="42" viewBox="0 0 32 32">
          <rect width="32" height="32" rx="7" fill="#1f2021" />
          <path
            d="M8 23 16 9.5 24 23"
            fill="none"
            stroke="#21a0f9"
            stroke-width="3.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <div class="name">grammar</div>
      </div>
      <h1>The horse raced past the&nbsp;barn fell.</h1>
      <div class="sub">Yes, that&rsquo;s a sentence.<br />Learn to diagram it yourself.</div>
      <div class="footer">
        <div class="tagline">Improve your grammar with sentence diagrams, <em>not LLMs.</em></div>
        <div class="url">adamsohn.com/grammar</div>
      </div>
    </div>
    <div class="card"><img src="og-diagram.png" onload="window.__done = true" /></div>
  </body>
</html>
